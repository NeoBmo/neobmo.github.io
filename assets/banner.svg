<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">NeoBmo, portafolio v6 (archivado)</title>
  <desc id="d">El logo \|° en rosa sobre fondo negro, junto al texto «portafolio v6» y una etiqueta «archivado».</desc>
  <style>
    :root { --bg: #050505; --text: #ffffff; --accent: #fb64b6; --dim: #6b6b6b; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .blink { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>
  <rect width="1280" height="360" rx="16" fill="var(--bg)"/>
  <g class="mono">
    <text x="96" y="150" fill="var(--text)" font-size="64" font-weight="700">NeoBmo</text>
    <text x="96" y="210" fill="var(--dim)" font-size="30">portafolio v6 · React + GSAP</text>
    <rect x="96" y="242" width="196" height="44" rx="22" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <text x="194" y="271" fill="var(--accent)" font-size="20" text-anchor="middle">archivado</text>
    <text x="1176" y="232" fill="var(--accent)" font-size="168" font-weight="700" text-anchor="end">\|°</text>
    <!-- El cursor que parpadea dice que esta versión ya no recibe cambios: se quedó esperando. -->
    <rect class="blink" x="1196" y="218" width="44" height="12" fill="var(--accent)"/>
  </g>
</svg>
